  "info": {
    "description": "Purpose-bound autonomous query identities. All operations are GET. Ordinary business and Console credentials are rejected. No mutations or raw credentials are exposed.",
    "license": {
      "identifier": "Apache-2.0",
      "name": "Apache-2.0"
    },
    "title": "Authova read-only Agent queries",
    "version": "0.1.0-rc.1"
  },
  "openapi": "3.1.2",
  "paths": {
    "/api/v1/apps/{app_id}/query/agents": {
      "get": {
        "description": "Requires authova.query.agents, a single urn:authova:query:APP_ID audience and a live autonomous Agent grant. Requires an App-wide installation; tenant-bound credentials are denied even with this scope.",
        "operationId": "queryAgentPage",
        "parameters": [
          {
            "in": "path",
            "name": "app_id",
            "required": true,
            "schema": {
              "format": "uuid",
              "type": "string"
            }
          },
          {
            "in": "query",
            "name": "cursor",
            "schema": {
              "maxLength": 128,
              "type": "string"
            }
          },
          {
            "in": "query",
            "name": "limit",
            "schema": {
              "default": 20,
              "maximum": 100,
              "minimum": 1,
              "type": "integer"
            }
          }
        ],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AgentPage"
                }
              }
            },
            "description": "Read-only result",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "const": "no-store",
                  "type": "string"
                }
              },
              "X-Request-ID": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "400": {
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            },
            "description": "Invalid or duplicate parameter"
          },
          "401": {
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            },
            "description": "Invalid or no longer live credential"
          },
          "403": {
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            },
            "description": "Wrong purpose, mode, scope or tenant boundary"
          },
          "404": {
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            },
            "description": "Object not in the approved boundary"
          },
          "405": {
            "description": "Only GET is accepted"
          },
          "429": {
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            },
            "description": "Admission rejected"
          },
          "503": {
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            },
            "description": "Dependency unavailable"
          }
        },
        "security": [
          {
            "queryAgent": []
          }
        ],
        "summary": "Query agents",
        "tags": [
          "queries"
        ],
        "x-required-scope": "authova.query.agents"
      }
    },
